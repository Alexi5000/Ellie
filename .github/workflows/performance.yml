name: Performance Testing

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      run: pnpm build

    - name: Start preview server
      run: |
        pnpm exec vite preview --host 127.0.0.1 --port 4173 &
        for i in $(seq 1 30); do curl -fsS http://localhost:4173 >/dev/null && break; sleep 1; done
        curl -fsS http://localhost:4173 >/dev/null

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@12.6.2
      with:
        urls: |
          http://localhost:4173
          http://localhost:4173/dashboard
        uploadArtifacts: true
        temporaryPublicStorage: true
        runs: 3

    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-results
        path: .lighthouseci

  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      run: pnpm build

    - name: Record production bundle sizes
      run: du -ah dist/public/assets | sort -h > bundle-sizes.txt

    - uses: actions/upload-artifact@v4
      with:
        name: bundle-sizes
        path: bundle-sizes.txt

  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build backend
      run: pnpm build

    - name: Start backend server
      run: |
        pnpm start &
        for i in $(seq 1 30); do curl -fsS http://localhost:5000/api/health >/dev/null && break; sleep 1; done
        curl -fsS http://localhost:5000/api/health >/dev/null
      env:
        NODE_ENV: production
        PORT: 5000
        DATABASE_URL: mysql://ellie:ellie@127.0.0.1:3306/ellie_ci
        JWT_SECRET: dummy-ci-jwt-secret-change-before-production
        BUILT_IN_FORGE_API_URL: https://forge.local.invalid
        BUILT_IN_FORGE_API_KEY: dummy-ci-forge-key
        REDIS_URL: redis://localhost:6379
        OPENAI_API_KEY: test_key
        GROQ_API_KEY: test_key

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Run load tests
      run: |
        k6 run --vus 10 --duration 30s - <<EOF
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export const options = { thresholds: { checks: ['rate==1'], http_req_failed: ['rate==0'], http_req_duration: ['p(95)<500'] } };

        export default function () {
          const res = http.get('http://localhost:5000/api/health');
          check(res, {
            'status is 200': (r) => r.status === 200,
            'response time < 500ms': (r) => r.timings.duration < 500,
          });
          sleep(1);
        }
        EOF
