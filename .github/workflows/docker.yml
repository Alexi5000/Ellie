name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Only log in / push when this is a tag build (publish event). Manual and
    # scheduled runs build locally and never push.
    - name: Log in to Container Registry
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build (and push on tags)
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: ${{ startsWith(github.ref, 'refs/tags/v') }}
        load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        pull: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Verify production image health
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      env:
        IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      run: |
        docker run -d --name ellie-smoke -p 127.0.0.1:3000:3000 \
          -e DATABASE_URL=mysql://ellie:ellie@127.0.0.1:3306/ellie_ci \
          -e JWT_SECRET=ci-only-placeholder-not-a-real-secret \
          -e BUILT_IN_FORGE_API_URL=https://forge.invalid \
          -e BUILT_IN_FORGE_API_KEY=ci-placeholder "$IMAGE"
        trap 'docker logs ellie-smoke; docker rm -f ellie-smoke' EXIT
        for attempt in $(seq 1 30); do
          if curl --fail http://127.0.0.1:3000/api/health; then exit 0; fi
          sleep 2
        done
        exit 1

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
